<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Bakery POS</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Campus Bakery</h1>
      <p>Counter checkout</p>
    </div>
    <span class="status">Cash only</span>
  </header>

  <main class="layout">
    <!-- Product Section -->
    <section class="panel products-panel" aria-labelledby="productsTitle">
      <div class="section-title">
        <h2 id="productsTitle">Menu</h2>
        <span>Tap Add to start an order</span>
      </div>
      <div id="productList" class="product-grid"></div>
    </section>

    <!-- Cart Section -->
    <section class="panel cart-panel" aria-labelledby="cartTitle">
      <div class="section-title">
        <h2 id="cartTitle">Current order</h2>
        <span id="cartCount" aria-live="polite">0 items</span>
      </div>

      <div id="cartList" class="cart-list">
        <div class="empty-state">No items yet. Add something from the menu.</div>
      </div>

      <div class="subtotal-box">
        <span>Subtotal</span>
        <strong id="subtotalAmount">₱0.00</strong>
      </div>
      <div class="total-box">
        <span>Total</span>
        <strong id="totalAmount">₱0.00</strong>
      </div>
      <div id="changeBox" class="change-box" hidden>
        <span>Change</span>
        <strong id="changeAmount"></strong>
      </div>

      <div class="payment-area">
        <label for="payment">Cash received</label>
        <input
          id="payment"
          type="number"
          inputmode="decimal"
          min="0"
          step="0.01"
          placeholder="0.00"
          autocomplete="off"
        >
        <button id="payBtn" class="primary-btn">Confirm payment</button>
        <div id="paymentMessage" class="message" role="status" aria-live="polite"></div>
      </div>
    </section>

    <!-- Receipt Section -->
    <section class="panel receipt-panel" aria-labelledby="receiptTitle">
      <div class="section-title">
        <h2 id="receiptTitle">Receipt</h2>
        <span>Printed after payment</span>
      </div>

      <div id="receipt" class="receipt">
        <div class="receipt-placeholder">
          Complete a valid payment to generate a receipt.
        </div>
      </div>

      <button id="newTransactionBtn" class="secondary-btn">
        Start new transaction
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
